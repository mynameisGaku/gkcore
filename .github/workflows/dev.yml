name: Development tests

on:
  push:
  pull_request:

jobs:
  core-and-resource-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure dependency-light tests
        run: cmake -S . -B build/dev -G Ninja -DGKCORE_BUILD_TESTS=ON -DGKCORE_BUILD_RUNTIME=OFF
      - name: Build tests
        run: cmake --build build/dev --parallel
      - name: Run tests
        run: ctest --test-dir build/dev --output-on-failure
